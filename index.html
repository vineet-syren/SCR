<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SCR — Supply Chain Resilience Command Center</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-theme="light">

<div class="shell">

  <!-- ======= App bar (dark) ======= -->
  <header class="appbar">
    <div class="appbar-brand">
      <div class="brand-mark" aria-label="SCR">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="scrFace" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a5b4fc"/>
              <stop offset=".45" stop-color="#6366f1"/>
              <stop offset="1" stop-color="#4338ca"/>
            </linearGradient>
            <linearGradient id="scrEdge" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#4338ca"/>
              <stop offset="1" stop-color="#2b2585"/>
            </linearGradient>
            <linearGradient id="scrGloss" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".62"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <radialGradient id="scrHub" cx="50%" cy="38%" r="70%">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#e0e7ff"/>
            </radialGradient>
          </defs>
          <!-- shield bevel (offset for 3D depth) -->
          <path d="M24 4.5 41 10.2v11.6c0 10.2-7.2 17.6-17 21.7-9.8-4.1-17-11.5-17-21.7V10.2Z" fill="url(#scrEdge)" transform="translate(0,2)"/>
          <!-- shield front face -->
          <path d="M24 4.5 41 10.2v11.6c0 10.2-7.2 17.6-17 21.7-9.8-4.1-17-11.5-17-21.7V10.2Z" fill="url(#scrFace)"/>
          <!-- top gloss highlight -->
          <path d="M24 4.5 41 10.2v6.1C41 12 33 9.6 24 9.6S7 12 7 16.3V10.2Z" fill="url(#scrGloss)"/>
          <!-- supply-chain hub & spokes (embossed) -->
          <g stroke="#e0e7ff" stroke-width="2.2" stroke-linecap="round" opacity=".92">
            <path d="M24 17.4V23M23 24.4 17.4 30M25 24.4 30.6 30"/>
          </g>
          <circle cx="24" cy="15.4" r="3.1" fill="url(#scrHub)"/>
          <circle cx="24" cy="23.4" r="2.5" fill="url(#scrHub)"/>
          <circle cx="16.6" cy="31.4" r="2.9" fill="url(#scrHub)"/>
          <circle cx="31.4" cy="31.4" r="2.9" fill="url(#scrHub)"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Supply Chain Resilience</span>
      </div>
    </div>

    <div class="global-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="globalSearch" placeholder="Search products, suppliers, materials, sites, alerts…" />
      <div class="search-results" id="searchResults"></div>
    </div>

    <div class="appbar-right">
      <button class="persona-pill" id="personaPill" title="Switch persona lens"><!-- populated by app.js --></button>
      <div class="refresh-ic">
        <button class="icon-btn" aria-label="Data freshness">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <div class="refresh-tip">
          <strong>Weekly refresh</strong><br/>
          Last refreshed <strong>10-Jul-2026 05:00 UTC</strong><br/>
          Next full recalc 17-Jul-2026 · external risk feeds refresh daily at 03:00 UTC
        </div>
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle dark mode">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="notifBtn" title="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="notif-dot" id="notifDot"></span>
      </button>
    </div>
  </header>

  <div class="body-row">

    <!-- ======= Sidebar (persona-mapped features) ======= -->
    <aside class="sidebar" id="sidebar">
      <nav class="side-nav" id="nav"><!-- populated by app.js --></nav>
    </aside>
    <button class="side-handle" id="sideToggle" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 7-5 5 5 5"/></svg>
    </button>

    <div class="main-col">
      <!-- ======= Breadcrumb row ======= -->
      <div class="crumbbar" id="crumbbar">
        <div class="crumb-trail" id="crumbTrail"></div>
      </div>

      <main class="page" id="pageScroll">
        <div class="page-inner" id="page"><!-- routed pages render here --></div>
      </main>
    </div>
  </div>

  <div class="notif-panel" id="notifPanel"><!-- populated by app.js --></div>
  <div class="persona-menu" id="personaMenu"><!-- populated by app.js --></div>
</div>

<!-- ======= Detail drawer ======= -->
<div class="drawer-scrim" id="drawerScrim"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-titles">
      <span class="drawer-kicker" id="drawerKicker"></span>
      <h2 id="drawerTitle"></h2>
    </div>
    <button class="icon-btn" id="drawerClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- ======= Copilot dock (FAB + panel, bottom-right) ======= -->
<button class="copilot-fab" id="copilotBtn">
  <span class="fab-dot"></span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.7 4.6L18 9.2l-4.3 1.6L12 15.4l-1.7-4.6L6 9.2l4.3-1.6Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/></svg>
  Resilience Copilot
</button>
<aside class="copilot" id="copilot">
  <div class="copilot-head">
    <div class="copilot-id">
      <div class="copilot-orb"></div>
      <div>
        <strong>Resilience Copilot</strong>
        <span id="copilotPersona">Natural-language resilience intelligence</span>
      </div>
    </div>
    <button class="icon-btn" id="copilotReset" title="New conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="icon-btn" id="copilotClose" title="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="copilot-thread" id="copilotThread"></div>
  <div class="copilot-suggests" id="copilotSuggests"></div>
  <form class="copilot-input" id="copilotForm">
    <input type="text" id="copilotText" placeholder="Ask about TTR, TTS, value at risk, nodes…" autocomplete="off" />
    <button type="submit" class="btn btn-primary">Send</button>
  </form>
</aside>

<!-- ======= Modal ======= -->
<div class="modal-scrim" id="modalScrim">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" id="modalClose" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script src="vendor/echarts.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/copilot.js"></script>
<script src="js/pages/executive.js"></script>
<script src="js/pages/valuestream.js"></script>
<script src="js/pages/category.js"></script>
<script src="js/pages/site.js"></script>
<script src="js/pages/network.js"></script>
<script src="js/pages/scenario.js"></script>
<script src="js/pages/actions.js"></script>
<script src="js/pages/agents.js"></script>
<script src="js/pages/quality.js"></script>
<script src="js/app.js"></script>
</body>
</html>
